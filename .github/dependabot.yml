# Dependabot keeps dependencies current automatically so the supply chain stays
# patched without manual checking. https://docs.github.com/code-security/dependabot
# Monthly + grouped: at most one PR per ecosystem per month, all bumps batched.
version: 2
updates:
  # Keep GitHub Actions (in .github/workflows) up to date.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns: ["*"]

  # Keep Python dependencies (pyproject.toml and uv.lock) up to date. The uv
  # ecosystem updates both files together, so it replaces the old pip entry
  # (having both for "/" would open duplicate PRs).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "deps"
    groups:
      python:
        patterns: ["*"]
