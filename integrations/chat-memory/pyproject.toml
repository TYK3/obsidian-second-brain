[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "second-brain"
version = "0.1.0"
description = "One Obsidian vault for every AI chat you have (Claude, Claude Code, Codex, ChatGPT, Gemini, Grok), shared by every AI you use via MCP."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
brain = "secondbrain.cli:main"

[tool.setuptools.packages.find]
include = ["secondbrain*"]

[tool.setuptools.package-data]
secondbrain = ["templates/*", "templates/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
